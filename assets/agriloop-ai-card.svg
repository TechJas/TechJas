<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">AgriLoop AI — dedicated project card</title>
  <desc id="desc">A burgundy and charcoal project card for AgriLoop AI, an agricultural circular-economy analytics and machine-learning platform built with Python, pandas, scikit-learn and Streamlit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="860" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#351323"/><stop offset="1" stop-color="#180D16"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#301522"/><stop offset="1" stop-color="#21101B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0A4C1"/><stop offset="1" stop-color="#AD416F"/></linearGradient>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.sans{font-family:Arial,Helvetica,sans-serif}
      .muted{fill:#C38AA5}.bright{fill:#F9DDE9}.accent{fill:#F0A4C1}.line{stroke:#78405A}.tag{fill:#432036;stroke:#94516F;stroke-width:1}
    </style>
  </defs>
  <rect x="1" y="1" width="858" height="518" rx="22" fill="url(#bg)" stroke="#B4517C" stroke-width="1.5"/>
  <path d="M2 22Q2 2 22 2H838Q858 2 858 22V68H2Z" fill="#542039" opacity=".55"/>
  <text x="30" y="32" class="mono accent" font-size="12" letter-spacing="2">PROJECT / 01</text>
  <text x="830" y="32" class="mono muted" font-size="11" text-anchor="end">APPLIED ML · DATA PLATFORM</text>
  <path d="M28 51H832" class="line" stroke-width="1.2"/>

  <text x="34" y="105" class="mono bright" font-size="29" font-weight="700">AgriLoop AI<tspan class="accent"> _</tspan></text>
  <text x="35" y="132" class="sans accent" font-size="14">Circular-economy intelligence for agricultural value chains</text>
  <text x="35" y="159" class="sans muted" font-size="12">An end-to-end platform exploring agricultural logistics, waste,</text>
  <text x="35" y="177" class="sans muted" font-size="12">and value opportunities through analytics and ML modules.</text>

  <rect x="34" y="202" width="142" height="75" rx="12" fill="#2A1422" stroke="#78405A"/>
  <text x="48" y="229" class="mono accent" font-size="23" font-weight="700">12,111</text>
  <text x="48" y="250" class="sans muted" font-size="11">records across datasets</text>
  <text x="48" y="265" class="sans muted" font-size="10">Reported project total</text>
  <rect x="188" y="202" width="142" height="75" rx="12" fill="#2A1422" stroke="#78405A"/>
  <text x="202" y="229" class="mono accent" font-size="23" font-weight="700">5</text>
  <text x="202" y="250" class="sans muted" font-size="11">integrated datasets</text>
  <text x="202" y="265" class="sans muted" font-size="10">Agriculture value chain</text>
  <rect x="342" y="202" width="142" height="75" rx="12" fill="#2A1422" stroke="#78405A"/>
  <text x="356" y="229" class="mono accent" font-size="23" font-weight="700">6</text>
  <text x="356" y="250" class="sans muted" font-size="11">analytics / prediction</text>
  <text x="356" y="265" class="sans muted" font-size="10">platform modules</text>

  <rect x="516" y="88" width="310" height="189" rx="15" fill="url(#panel)" stroke="#A84D78"/>
  <text x="536" y="113" class="mono accent" font-size="10" letter-spacing="1.2">PLATFORM SNAPSHOT</text>
  <path d="M536 126H806" class="line"/>
  <text x="536" y="150" class="sans bright" font-size="12">Explore</text><text x="806" y="150" class="mono muted" font-size="10" text-anchor="end">DATA QUALITY + EDA</text>
  <path d="M536 161H806" class="line" opacity=".55"/>
  <text x="536" y="184" class="sans bright" font-size="12">Analyze</text><text x="806" y="184" class="mono muted" font-size="10" text-anchor="end">LOGISTICS + WASTE</text>
  <path d="M536 195H806" class="line" opacity=".55"/>
  <text x="536" y="218" class="sans bright" font-size="12">Model</text><text x="806" y="218" class="mono muted" font-size="10" text-anchor="end">PREDICTION MODULES</text>
  <path d="M536 229H806" class="line" opacity=".55"/>
  <text x="536" y="252" class="sans bright" font-size="12">Present</text><text x="806" y="252" class="mono muted" font-size="10" text-anchor="end">STREAMLIT + PLOTLY</text>

  <text x="35" y="316" class="mono accent" font-size="10" letter-spacing="1.5">TECH STACK</text>
  <rect x="34" y="330" width="86" height="25" rx="12" class="tag"/><text x="77" y="346" class="mono bright" font-size="10" text-anchor="middle">Python</text>
  <rect x="130" y="330" width="88" height="25" rx="12" class="tag"/><text x="174" y="346" class="mono bright" font-size="10" text-anchor="middle">pandas</text>
  <rect x="228" y="330" width="119" height="25" rx="12" class="tag"/><text x="287.5" y="346" class="mono bright" font-size="10" text-anchor="middle">scikit-learn</text>
  <rect x="357" y="330" width="91" height="25" rx="12" class="tag"/><text x="402.5" y="346" class="mono bright" font-size="10" text-anchor="middle">Streamlit</text>
  <rect x="458" y="330" width="80" height="25" rx="12" class="tag"/><text x="498" y="346" class="mono bright" font-size="10" text-anchor="middle">Plotly</text>

  <path d="M34 382H826" class="line" stroke-width="1.2"/>
  <text x="35" y="408" class="mono muted" font-size="10">FOCUS</text>
  <text x="35" y="430" class="sans bright" font-size="12">Data integration · Feature engineering · Interactive analytics</text>
  <text x="35" y="451" class="sans muted" font-size="11">Add a verified model metric or a concrete insight here if it strengthens the story.</text>
  <a xlink:href="https://github.com/TechJas/AI_CIRCULAR-ECONOMY" target="_blank"><rect x="34" y="472" width="170" height="30" rx="8" fill="url(#accent)"/><text x="119" y="491" class="mono" fill="#28101D" font-size="10" font-weight="700" text-anchor="middle">VIEW REPOSITORY ↗</text></a>
  <a xlink:href="https://aicircular-economy-2026.streamlit.app/" target="_blank"><rect x="216" y="472" width="130" height="30" rx="8" fill="#432036" stroke="#94516F"/><text x="281" y="491" class="mono bright" font-size="10" text-anchor="middle">LIVE DEMO ↗</text></a>
  <text x="826" y="491" class="mono muted" font-size="9" text-anchor="end">TECHJAS / PORTFOLIO</text>
</svg>
