<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="760" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
  <title id="title">Jasmin Banu M. — hanging AI/ML profile ID card</title>
  <desc id="desc">A teal-hijab portrait on a dark burgundy and navy ID card, gently swinging from a rose-colored lanyard.</desc>
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6f153d"/><stop offset=".48" stop-color="#d52d6d"/><stop offset="1" stop-color="#47102f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12152d"/><stop offset=".55" stop-color="#190e24"/><stop offset="1" stop-color="#2a0b20"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b9dff"/><stop offset=".48" stop-color="#ef6eb8"/><stop offset="1" stop-color="#ff386e"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b6b76"/><stop offset=".25" stop-color="#fff0e8"/><stop offset=".55" stop-color="#9e8991"/><stop offset=".8" stop-color="#fce7dc"/><stop offset="1" stop-color="#68525f"/></linearGradient>
    <clipPath id="portraitClip"><rect x="126" y="260" width="268" height="230" rx="18"/></clipPath>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <!-- The lanyard remains mostly still; the badge swings from its top attachment point. -->
  <path d="M202 -12 L244 116 L276 116 L318 -12" fill="none" stroke="#260d25" stroke-width="40" stroke-linecap="round"/>
  <path d="M202 -12 L244 116 L276 116 L318 -12" fill="none" stroke="url(#strap)" stroke-width="31" stroke-linecap="round"/>
  <path d="M202 -12 L244 116 L276 116 L318 -12" fill="none" stroke="#ff6da9" stroke-width="1.5" stroke-dasharray="3 7" opacity=".7"/>
  <g transform="rotate(0 260 140)">
    <rect x="221" y="103" width="78" height="32" rx="10" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <path d="M238 128 L238 164 Q238 174 248 174 L272 174 Q282 174 282 164 L282 128" fill="url(#metal)" stroke="#59414e" stroke-width="2"/>
    <path d="M247 170 L247 190 Q247 203 260 203 Q273 203 273 190 L273 170" fill="none" stroke="url(#metal)" stroke-width="8"/>
  </g>
  <g id="swingingBadge" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="rotate" values="-4 260 206;4 260 206;-4 260 206" keyTimes="0;0.5;1" dur="5.2s" repeatCount="indefinite"/>
    <rect x="92" y="198" width="336" height="500" rx="27" fill="url(#card)" stroke="url(#edge)" stroke-width="3"/>
    <rect x="102" y="208" width="316" height="480" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="226" y="207" width="68" height="12" rx="6" fill="#100c1c" stroke="#c64b99" stroke-width="1.5"/>
    <rect x="126" y="260" width="268" height="230" rx="18" fill="#0a1021" stroke="#654b92" stroke-width="1.4"/>
    <image x="126" y="260" width="268" height="230" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" xlink:href="id.png"/>
    <rect x="126" y="260" width="268" height="230" rx="18" fill="none" stroke="#9b6ba8" stroke-opacity=".45"/>
    <text x="260" y="535" text-anchor="middle" fill="#fff0f5" font-family="Georgia, 'Times New Roman', serif" font-size="29">Jasmin Banu M.</text>
    <text x="260" y="568" text-anchor="middle" fill="#f4dce9" font-family="Arial, Helvetica, sans-serif" font-size="14.5">AI/ML Engineering · Healthcare AI</text>
    <text x="260" y="589" text-anchor="middle" fill="#f4dce9" font-family="Arial, Helvetica, sans-serif" font-size="14.5">Data Science</text>
    <path d="M130 613 H390" stroke="#b54a92" stroke-width="1" opacity=".8"/>
    <path d="M94 660 C145 635 174 683 224 660 S298 644 342 667 S389 651 426 638" fill="none" stroke="#f32f8b" stroke-width="1.2" opacity=".8"/>
    <path d="M94 670 C145 645 174 693 224 670 S298 654 342 677 S389 661 426 648" fill="none" stroke="#6b66ff" stroke-width="1" opacity=".7"/>
    <g fill="#f43d9a"><circle cx="345" cy="664" r="3"/><circle cx="386" cy="650" r="2.5"/><circle cx="415" cy="643" r="2"/></g>
    <g stroke="#bd54d5" stroke-width="1" opacity=".65"><path d="M345 664 L386 650 L415 643 L402 678 L345 664" fill="none"/><path d="M386 650 L402 678"/></g>
  </g>
  <style>
    @media (prefers-reduced-motion: reduce) { #swingingBadge animateTransform { display: none; } }
  </style>
</svg>
