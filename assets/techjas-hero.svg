<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">TechJas — AI/ML Engineering, Healthcare AI, Data Science</title>
  <desc id="hero-desc">Cinematic portfolio banner for Jasmin Banu M. Deep burgundy and dark plum composition with a connected-node data motif, concentric analysis rings and a rising signal line. Text reads: TechJas. AI/ML Engineering, Healthcare AI, Data Science. Building thoughtful machine-learning systems from real-world data.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08040A"/>
      <stop offset="42%" stop-color="#1B0913"/>
      <stop offset="100%" stop-color="#341020"/>
    </linearGradient>

    <radialGradient id="vignette" cx="52%" cy="44%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4688C" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#8A1E42" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8A1E42" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowHot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6C3D3" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F6C3D3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#FCE7EE"/>
      <stop offset="55%" stop-color="#E7A3BA"/>
      <stop offset="100%" stop-color="#C06588"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7A3BA"/>
      <stop offset="100%" stop-color="#E7A3BA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="signalGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E2E52"/>
      <stop offset="45%" stop-color="#E08CA8"/>
      <stop offset="100%" stop-color="#FBE4EC"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4688C" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#D4688C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C1330" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C05E85"/>
      <stop offset="70%" stop-color="#5C1330" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5C1330" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dataGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#D4688C" stroke-width="0.7" opacity="0.16"/>
    </pattern>

    <pattern id="fineGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#E08CA8" stroke-width="0.5" opacity="0.13"/>
    </pattern>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="ns"/>
      <feComponentTransfer in="ns">
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="860" height="500" fill="url(#bgGrad)"/>
  <rect width="860" height="500" fill="url(#dataGrid)" opacity="0.5"/>
  <rect x="520" y="40" width="310" height="355" fill="url(#fineGrid)" opacity="0.5"/>

  <!-- diagonal light sweep -->
  <path d="M0 0 L300 0 L110 500 L0 500 Z" fill="#FFFFFF" opacity="0.022"/>
  <path d="M520 0 L600 0 L410 500 L330 500 Z" fill="#E7A3BA" opacity="0.030"/>

  <!-- ================= MOTIF : BACKGROUND LIGHT ================= -->
  <circle cx="690" cy="212" r="250" fill="url(#glowRose)"/>
  <circle cx="770" cy="222" r="130" fill="url(#glowHot)"/>

  <!-- ================= MOTIF : CONCENTRIC ANALYSIS RINGS ================= -->
  <g fill="none" stroke="#D4688C">
    <circle cx="690" cy="212" r="214" stroke-width="1" opacity="0.10" stroke-dasharray="2 7"/>
    <circle cx="690" cy="212" r="168" stroke-width="1" opacity="0.14" stroke-dasharray="3 9"/>
    <circle cx="690" cy="212" r="122" stroke-width="1.1" opacity="0.18" stroke-dasharray="4 11"/>
    <circle cx="690" cy="212" r="78" stroke-width="1.1" opacity="0.22"/>
  </g>

  <!-- ================= MOTIF : EDGES ================= -->
  <g stroke="#D4688C" stroke-width="0.9" opacity="0.38" fill="none">
    <path d="M552 292 L592 238 L648 280 L700 188 L764 236 L818 172"/>
    <path d="M592 238 L582 128 L672 112 L770 96"/>
    <path d="M700 188 L672 112"/>
    <path d="M648 280 L704 348 L818 322"/>
    <path d="M764 236 L818 322"/>
    <path d="M552 292 L604 340 L704 348"/>
    <path d="M818 172 L818 322" opacity="0.5"/>
  </g>

  <!-- ================= MOTIF : SIGNAL LINE + AREA ================= -->
  <path d="M552 292 C600 262 624 300 648 280 C690 250 730 268 764 236 C790 212 806 186 818 172 L818 392 L552 392 Z" fill="url(#areaGrad)"/>
  <path d="M552 292 C600 262 624 300 648 280 C690 250 730 268 764 236 C790 212 806 186 818 172"
        fill="none" stroke="url(#signalGrad)" stroke-width="2.4" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- ================= MOTIF : NODES ================= -->
  <g filter="url(#softGlow)">
    <circle cx="552" cy="292" r="4.4" fill="#C98AA2"/>
    <circle cx="592" cy="238" r="6.4" fill="#E7A3BA"/>
    <circle cx="648" cy="280" r="4.0" fill="#C98AA2"/>
    <circle cx="700" cy="188" r="7.4" fill="#F7D2DE"/>
    <circle cx="764" cy="236" r="5.0" fill="#E7A3BA"/>
    <circle cx="818" cy="172" r="6.0" fill="#FBE4EC"/>
    <circle cx="582" cy="128" r="4.0" fill="#C98AA2"/>
    <circle cx="672" cy="112" r="6.0" fill="#E7A3BA"/>
    <circle cx="770" cy="96" r="4.4" fill="#C98AA2"/>
    <circle cx="818" cy="322" r="5.0" fill="#E7A3BA"/>
    <circle cx="704" cy="348" r="3.4" fill="#C98AA2"/>
    <circle cx="604" cy="340" r="4.4" fill="#C98AA2"/>
  </g>

  <!-- ================= MOTIF : MINI SCATTER PLOT ================= -->
  <g stroke="#C05E85" stroke-width="1" opacity="0.55" fill="none">
    <path d="M748 392 L836 392"/>
    <path d="M748 392 L748 344"/>
  </g>
  <g fill="#E7A3BA" opacity="0.6">
    <circle cx="760" cy="378" r="2.3"/>
    <circle cx="772" cy="366" r="2.3"/>
    <circle cx="786" cy="382" r="2.3"/>
    <circle cx="798" cy="356" r="2.3"/>
    <circle cx="812" cy="364" r="2.3"/>
    <circle cx="824" cy="342" r="2.3"/>
    <circle cx="778" cy="350" r="2.0"/>
    <circle cx="806" cy="388" r="2.0"/>
    <circle cx="754" cy="366" r="2.0"/>
    <circle cx="830" cy="382" r="2.0"/>
  </g>
  <path d="M756 384 L800 358 L828 340" fill="none" stroke="#F7D2DE" stroke-width="1.2" opacity="0.55"/>

  <!-- motif caption (on a plate so it does not fight the analysis rings) -->
  <rect x="470" y="32" width="376" height="30" rx="4" fill="#0A0409" opacity="0.80" stroke="#6E1734" stroke-width="0.9" stroke-opacity="0.75"/>
  <text x="846" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="11" letter-spacing="1.5" fill="#9E6274">FIG. 01 — PERSONAL BASELINE / ANOMALY SCORE</text>

  <!-- ================= LEFT : TYPE ================= -->
  <text x="54" y="82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="16" letter-spacing="4.6" fill="#9E6274">JASMIN BANU M.</text>

  <text x="50" y="214" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="-1.5" fill="url(#titleGrad)">TechJas</text>

  <rect x="54" y="250" width="190" height="3" fill="url(#ruleGrad)"/>

  <text x="54" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic"
        fill="#F3D6DF">Building thoughtful machine-learning</text>
  <text x="54" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic"
        fill="#F3D6DF">systems from real-world data.</text>

  <text x="54" y="390" font-family="ui-monospace, SFMono-Regular, Consolas, monospace"
        font-size="14" letter-spacing="2.2" fill="#8E5A6C">EDA · BASELINE SCORING · MODEL EVALUATION</text>

  <!-- ================= BOTTOM BAND ================= -->
  <rect x="0" y="414" width="860" height="86" fill="#050308" opacity="0.66"/>
  <rect x="0" y="413" width="860" height="1.4" fill="url(#frameGrad)"/>

  <text x="430" y="452" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="5" fill="#EDB6C8">AI/ML ENGINEERING</text>
  <text x="430" y="484" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="3.4" fill="#AE7690">HEALTHCARE AI  ·  DATA SCIENCE</text>

  <!-- ================= FRAME + GRAIN ================= -->
  <rect x="0" y="0" width="860" height="500" fill="url(#vignette)"/>
  <rect x="0" y="0" width="860" height="500" filter="url(#grain)" opacity="0.9"/>
  <rect x="0" y="0" width="860" height="2" fill="url(#frameGrad)" opacity="0.85"/>
  <rect x="0" y="498" width="860" height="2" fill="url(#frameGrad)" opacity="0.5"/>
</svg>
